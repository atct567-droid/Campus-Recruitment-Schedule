name: GUAT authorized public source discovery

on:
  push:
    branches: ['preview/guat-live-20261014']
    paths: ['.github/workflows/authorized-live-preview.yml', 'scripts/discover_public_source.py', 'scripts/observe_public_browser.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guat-authorized-live-preview
  cancel-in-progress: false

jobs:
  public-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e . 'playwright>=1.55,<2'
      - name: Inspect publicly served frontend configuration
        run: python scripts/discover_public_source.py
      - name: Observe a fresh logged-out browser visiting public recruitment pages
        run: python scripts/observe_public_browser.py
      - name: Save public route discovery evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guat-public-discovery-${{ github.run_id }}
          path: |
            reports/public-discovery/
            reports/public-browser/
          retention-days: 14
          if-no-files-found: warn
