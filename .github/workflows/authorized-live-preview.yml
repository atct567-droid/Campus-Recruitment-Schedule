name: GUAT authorized anonymous requests verification

on:
  push:
    branches: ['preview/guat-live-20261014']
    paths: ['.github/workflows/authorized-live-preview.yml', 'scripts/verify_public_requests.py']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: guat-authorized-live-preview
  cancel-in-progress: false

jobs:
  public-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify normal anonymous request context with requests
        run: python scripts/verify_public_requests.py
      - name: Save anonymous request verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: guat-public-requests-${{ github.run_id }}
          path: reports/public-requests/
          retention-days: 14
          if-no-files-found: warn
