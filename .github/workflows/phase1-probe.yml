name: Phase 1 API probe

on:
  workflow_dispatch:
    inputs:
      anchor_date:
        description: 'YYYY-MM-DD; blank uses today in Asia/Shanghai'
        required: false
        default: ''
      date_field:
        description: 'Actual fair start date field from a verified JSON response'
        required: false
        default: ''
      id_field:
        description: 'Actual fair ID field'
        required: false
        default: 'jobFairId'
      job_fair_id:
        description: 'Optional real known fair ID; otherwise discover from list'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: guat-phase1-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - name: Verify anonymous API contracts
        env:
          PROBE_ANCHOR_DATE: ${{ inputs.anchor_date }}
          PROBE_DATE_FIELD: ${{ inputs.date_field }}
          PROBE_ID_FIELD: ${{ inputs.id_field }}
          PROBE_FAIR_ID: ${{ inputs.job_fair_id }}
        run: |
          python - <<'PY'
          import os
          from campus_recruitment.probe import main
          args = ['--output-dir', 'reports/phase1', '--request-budget', '200']
          for variable, flag in [
              ('PROBE_ANCHOR_DATE', '--anchor-date'),
              ('PROBE_DATE_FIELD', '--date-field'),
              ('PROBE_ID_FIELD', '--id-field'),
              ('PROBE_FAIR_ID', '--job-fair-id'),
          ]:
              value = os.environ.get(variable, '')
              if value:
                  args.extend([flag, value])
          raise SystemExit(main(args))
          PY
      - name: Save evidence even when verification fails
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase1-evidence-${{ github.run_id }}
          path: reports/phase1/
          if-no-files-found: warn
          retention-days: 14
