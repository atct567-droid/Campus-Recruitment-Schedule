name: Recruitment scheduled pipeline

on:
  schedule:
    # UTC 22:00/04:00/10:00 = Asia/Shanghai 06:00/12:00/18:00.
    - cron: '0 4,10,22 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'offline uses synthetic fixtures; real still needs repository opt-in'
        type: choice
        options: [offline, real]
        default: offline
      start_date:
        description: 'YYYY-MM-DD; blank uses fixture reference date or current Shanghai date'
        required: false
      end_date:
        description: 'YYYY-MM-DD exclusive end; blank uses 30 days'
        required: false
      job_fair_id:
        description: 'Optional real/fixture fair ID for historical lookup'
        required: false
      reports:
        type: boolean
        default: true
      calendar_dry_run:
        type: boolean
        default: true
      enable_real_calendar_sync:
        description: 'Explicit account-write opt-in; requires real mode and separate repository variable/Secrets'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: guat-recruitment-state-${{ github.ref }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUN_MODE: ${{ inputs.mode || 'real' }}
      ENABLE_REAL_COLLECTION: ${{ vars.ENABLE_REAL_COLLECTION || 'false' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test,calendar]'
      - name: Restore sanitized recruitment state and opaque event mappings
        uses: actions/cache/restore@v4
        with:
          path: state-cache/
          key: recruitment-${{ env.RUN_MODE }}-${{ github.run_id }}
          restore-keys: recruitment-${{ env.RUN_MODE }}-
      - name: Collect or clearly skip when real collection is disabled
        env:
          RUN_START: ${{ inputs.start_date }}
          RUN_END: ${{ inputs.end_date }}
          RUN_FAIR_ID: ${{ inputs.job_fair_id }}
          RUN_SCHEMA: ${{ env.RUN_MODE == 'real' && (vars.GUAT_SCHEMA_PATH || 'configs/school-schema.example.json') || '' }}
          RUN_REPORTS: ${{ github.event_name == 'schedule' && 'true' || inputs.reports && 'true' || 'false' }}
          RUN_CALENDAR_DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || inputs.calendar_dry_run && 'true' || 'false' }}
        run: python scripts/run_workflow.py
      - name: Validate report and ICS formats or the explicit skip result
        if: github.event_name == 'schedule' || inputs.reports
        run: python scripts/validate_outputs.py reports/public
      - name: Explicit real Google sync (never enabled by schedule)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'real' && inputs.enable_real_calendar_sync && vars.ENABLE_REAL_CALENDAR_SYNC == 'true' && vars.ENABLE_REAL_COLLECTION == 'true'
        env:
          ENABLE_REAL_CALENDAR_SYNC: 'true'
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GOOGLE_OAUTH_TOKEN_JSON: ${{ secrets.GOOGLE_OAUTH_TOKEN_JSON }}
          GOOGLE_CALENDAR_ID: ${{ vars.GOOGLE_CALENDAR_ID }}
        run: |
          python - <<'PY'
          import os
          from campus_recruitment.cli import main
          args = ['sync', '--db', 'work/run.db', '--output-dir', 'reports/calendar', '--enable-real-sync']
          calendar_id = os.environ.get('GOOGLE_CALENDAR_ID', '')
          if calendar_id:
              args.extend(['--calendar-id', calendar_id])
          raise SystemExit(main(args))
          PY
      - name: Checkpoint successful mappings even after a partial calendar failure
        if: always()
        env:
          RUN_MODE: ${{ inputs.mode || 'real' }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.checkpoint_calendar_state import checkpoint
          mode = os.environ['RUN_MODE']
          if mode not in ('offline', 'real'):
              raise SystemExit('Invalid state mode')
          checkpoint(Path('work/run.db'), Path('state-cache') / (mode + '.db'))
          PY
      - name: Save sanitized recruitment state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state-cache/
          key: recruitment-${{ env.RUN_MODE }}-${{ github.run_id }}
      - name: Keep failure summaries and public artifacts (no raw DB/private/token files)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recruitment-public-${{ github.run_id }}
          path: reports/
          if-no-files-found: warn
          retention-days: 14
