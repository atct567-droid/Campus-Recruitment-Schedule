name: Public school links read-only check
on:
  push:
    branches: [preview/guat-link-check]
    paths:
      - scripts/probe_school_links.py
      - .github/workflows/school-links-check.yml
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[test]' playwright
      - run: python -m playwright install --with-deps chromium
      - run: python scripts/probe_school_links.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: public-school-links-${{ github.run_id }}
          path: reports/school-links/
          retention-days: 14
