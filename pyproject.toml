[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-recruitment-schedule"
version = "0.2.0"
description = "GUAT anonymous recruitment API validation (phase 1)"
requires-python = ">=3.10"
dependencies = ["requests>=2.32.3,<3", "tzdata>=2025.1"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.8,<1", "icalendar>=6,<8", "PyYAML>=6,<7", "google-auth>=2.35,<3"]
calendar = ["google-auth>=2.35,<3", "google-auth-oauthlib>=1.2,<2"]

[project.scripts]
campus-recruitment = "campus_recruitment.probe:main"
campus-manager = "campus_recruitment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
"campus-recruitment/configs" = ["configs/*.json"]
"campus-recruitment/fixtures" = ["fixtures/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
